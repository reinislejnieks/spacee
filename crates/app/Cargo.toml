[package]
name = "spacee"
edition.workspace = true
version.workspace = true

[dependencies]
gpui-kit.workspace = true
scan = { path = "../scan" }
icicle = { path = "../icicle" }
libc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
